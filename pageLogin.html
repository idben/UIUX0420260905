<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登入介面的組合</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  </head>
  <body>
    <div class="
      block bg-secondary-subtle w-50 h-50 position-absolute
      top-50 start-50 translate-middle
      rounded-4 border border-secondary-subtle border-2 shadow 
    ">
      <h1 class="fw-bold text-center m-0 py-3">LOGIN</h1>

    <div class="px-3 hstack gap-1 mb-1">
      <label for="exampleFormControlInput1" class="form-label mb-0 ">email</label>
      <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
    </div>

    <div class="px-3 hstack gap-1 mb-3">
      <label for="exampleFormControlInput1" class="form-label mb-0 ">password</label>
      <input type="password" class="form-control" id="exampleFormControlInput1" placeholder="input password">
    </div>

  <div class="d-flex justify-content-end gap-2 px-3">
    <button class="btn btn-primary" type="button">送出</button>
    <button class="btn btn-danger" type="button">取消</button>
  </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" ></script>
  </body>
</html>
