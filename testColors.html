<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>測試顏色</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  </head>
  <body>
    <div class="text-primary fs-1 text-end">primary</div>
    <div class="text-primary-emphasis display-1 fw-bold">emphasis</div>
    <div class="text-secondary fs-3 text-center">secondary</div>
    <div class="text-success h1">success</div>
    <div class="text-danger h3">danger</div>
    <div class="text-warning display-1">warning</div>
    <div class="text-info">info</div>
    <div class="bg-primary text-white h1 m-0">白字</div>
    <div class="bg-primary-subtle">primary-subtle</div>
    <div class="bg-secondary text-light h1 m-0">灰字(接近白)</div>
    <div class="bg-secondary-subtle">secondary-subtle</div>
    <div class="bg-success text-black h1 m-0">黑字</div>
    <div class="bg-success-subtle">success-subtle</div>
    <div class="bg-danger text-dark h1 m-0">灰字(接近黑)</div>
    <div class="bg-danger-subtle">danger-subtle</div>
    <div class="bg-warning">bg warning</div>
    <div class="bg-warning-subtle">warning-subtle</div>
    <div class="bg-info">bg info</div>
    <div class="bg-info-subtle">info-subtle</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
